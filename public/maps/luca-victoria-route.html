<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victoria and Luca — our wedding locations</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css">
  <style>
    html,body,#map{height:100%;width:100%;margin:0}body{background:#eeeee3;color:#536542;font:14px/1.4 Georgia,serif}#map{position:absolute;inset:0}
    .place{display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none}.pin{display:grid;place-items:center;width:27px;height:27px;background:#536542;color:#fffdf7;border:2px solid #fffdf7;border-radius:50%;font:bold 13px Georgia,serif;box-shadow:0 2px 8px #46543a28}
    .label{padding:5px 9px;background:#faf8f1f5;border:1px solid #c7b486;color:#46543a;font:13px/1.3 Georgia,serif}.maplibregl-ctrl-attrib{font:11px/1.5 Arial,sans-serif;background:#faf8f1ed!important;color:#536542!important}.maplibregl-ctrl-attrib a{color:#536542!important}a:focus-visible{outline:2px solid #536542;outline-offset:2px}
    #status{position:absolute;inset:0;display:grid;place-content:center;padding:35px;text-align:center;background:#eeeee3;pointer-events:none}#status p{max-width:30ch;margin:8px auto}#status[hidden]{display:none}
    @media(max-width:420px){.label{font-size:12px;padding:4px 6px}.pin{width:23px;height:23px}.place{gap:4px}}
  </style>
</head>
<body>
  <div id="map" role="img" aria-label="Wedding venue map"></div>
  <div id="status" role="status"><p>Finding our places…</p></div>
  <script type="module">
    const status = document.querySelector('#status');
    const ceremonyOnly = new URLSearchParams(location.search).get('ceremony') === '1';
    const church = [-79.62847,43.60231];
    // Coordinates linked from The Venetian's official contact page.
    const reception = [-79.5298814,43.8172461];
    let loaded = false;
    const fallback = () => { if (!loaded) {status.hidden=false;status.textContent='The map is unavailable right now. Use the directions link below to plan your journey.';} };
    const timeout = setTimeout(fallback,15000);
    try {
      const [{Map,Marker}, style] = await Promise.all([
        import('https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.mjs'),
        fetch('https://tiles.openfreemap.org/styles/positron').then(r=>{if(!r.ok)throw new Error('Map unavailable');return r.json()})
      ]);
      // Style real geographic data in the invitation's paper, sage and gold palette.
      for (const layer of style.layers) {
        layer.paint ||= {};
        const id = layer.id.toLowerCase();
        if(layer.type==='background')layer.paint['background-color']='#f7f5ec';
        if(layer.type==='fill'){
          if(/water/.test(id))layer.paint['fill-color']='#d8e3db';
          else if(/park|wood|grass|landcover/.test(id))layer.paint['fill-color']='#e0e6d3';
          else if(/building/.test(id))layer.paint['fill-color']='#e8e5d9';
        }
        if(layer.type==='line' && /road|highway|motorway/.test(id))layer.paint['line-color']=/casing|outline/.test(id)?'#d5d4c3':'#fffdf7';
        if(layer.type==='symbol'){
          if(/poi|housenumber|transit|airport|aeroway/.test(id)){layer.layout ||= {};layer.layout.visibility='none';}
          else if(layer.layout?.['text-field']){layer.paint['text-color']='#68735c';layer.paint['text-halo-color']='#faf8f1';}
        }
      }
      const map = new Map({container:'map',style,center:church,zoom:13,interactive:false,attributionControl:{compact:false},fadeDuration:0});
      const addPlace = (coords,letter,text,anchor) => {
        const el=document.createElement('div');el.className='place';
        const pin=document.createElement('span');pin.className='pin';pin.textContent=letter;
        const label=document.createElement('span');label.className='label';label.textContent=text;
        el.append(pin,label);new Marker({element:el,anchor,offset:[-13,0]}).setLngLat(coords).addTo(map);
      };
      map.on('load',async()=>{
        try {
          if(!ceremonyOnly){
            const response=await fetch('/maps/luca-victoria-route.geojson');if(!response.ok)throw new Error('Route unavailable');
            const route=await response.json();map.addSource('wedding-route',{type:'geojson',data:route});
            map.addLayer({id:'route-paper',type:'line',source:'wedding-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#faf8f1','line-width':8}});
            map.addLayer({id:'route-sage',type:'line',source:'wedding-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#536542','line-width':3.5}});
            const coords=route.geometry.coordinates;
            const bounds=[[Math.min(...coords.map(c=>c[0])),Math.min(...coords.map(c=>c[1]))],[Math.max(...coords.map(c=>c[0])),Math.max(...coords.map(c=>c[1]))]];
            const frame=()=>map.fitBounds(bounds,{padding:{top:50,bottom:50,left:35,right:Math.min(180,innerWidth*.38)},duration:0});
            frame();new ResizeObserver(frame).observe(document.body);
            addPlace(reception,'B','Reception · Concord','left');
          }
          addPlace(church,'A','Ceremony · Mississauga','left');
          document.querySelector('#map').setAttribute('aria-label',ceremonyOnly?'Map showing Saints Peter and Paul Parish, Mississauga':'Map from Saints Peter and Paul Parish in Mississauga to The Venetian in Concord');
          loaded=true;clearTimeout(timeout);status.hidden=true;
        }catch{clearTimeout(timeout);fallback();}
      });
      map.on('error',()=>{if(!loaded)fallback();});
    } catch { clearTimeout(timeout);fallback(); }
  </script>
</body>
</html>
